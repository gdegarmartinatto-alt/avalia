<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho | Avalia</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="carrinho-page">

    <!-- Cabeçalho -->
    <header class="topo">
        <a href="/">
            <img src="{{ url_for('static', filename='imagens/logo.png') }}"
                 alt="Logo Avalia"
                 class="logo-topo">
        </a>

        <nav class="menu">
            <a href="{{ url_for('diagnostico') }}">🔧 Diagnóstico</a>
            <a href="{{ url_for('pecas') }}">⚙ Peças</a>
            <a href="{{ url_for('mecanicos') }}">📍 Mecânicos</a>
            <a href="{{ url_for('tutoriais') }}">📚 Tutoriais</a>
            <a href="{{ url_for('carrinho') }}">🛒 Carrinho</a>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main class="container-carrinho">

        <h1>Meu Carrinho</h1>

        <!-- Lista de produtos -->
        <div id="lista-carrinho">
            <p>Seu carrinho está vazio.</p>
        </div>

        <!-- Resumo do pedido -->
        <div class="resumo-carrinho">

            <h2>Resumo do pedido</h2>

            <p>
                Subtotal:
                <span id="subtotal">R$ 0,00</span>
            </p>

            <p>
                Total:
                <strong id="total">R$ 0,00</strong>
            </p>

            <button id="finalizar-compra">
                Finalizar pedido
            </button>

        </div>

    </main>

    <!-- JavaScript do carrinho -->
    <script src="{{ url_for('static', filename='js/carrinho.js') }}"></script>

</body>
</html>
